openapi: 3.1.0

info:
  title: TransGuía — API
  version: "0.2.0"
  description: >
    API del backend de TransGuía: autenticación, registro de unidades y
    choferes según normativa del MTC, documentos con vencimiento, y
    tickets de traslado vinculados a la GRE-Transportista de SUNAT.

    ## Autenticación

    Todas las rutas exigen un token de sesión salvo `POST /api/auth/login`
    y `GET /api/health`. El token se obtiene en el login y se envía en la
    cabecera `Authorization: Bearer <token>`. Dura 12 horas.

    El `empresaId` sale SIEMPRE del token: no se envía en la query ni en
    el cuerpo, y un usuario nunca ve datos de otra empresa.

    ## Roles

    - `operador`: crea y mueve tickets.
    - `admin_empresa`: además registra unidades, choferes, documentos y
      usuarios. Las rutas marcadas *(admin)* devuelven 403 para un operador.
    - `superadmin`: rol de plataforma, sin empresa propia. Ve todas las
      empresas (`/api/empresas`, `/api/resumen`) y consulta los datos de
      una empresa cualquiera pasando `?empresaId=<uuid>` en las rutas de
      lectura. No puede escribir datos de empresa (403 en las rutas *(admin)*
      y en crear/avanzar tickets). Rutas *(superadmin)*: 403 para los demás.

    ## Emisión de la GRE

    Es asíncrona: `POST /api/tickets` responde con
    `estadoSunat: "ENVIANDO"`; hay que consultar `GET /api/tickets/{id}`
    hasta que cambie a `ACEPTADO`, `RECHAZADO` u `OBSERVADO`. El proveedor
    se elige con `GRE_PROVIDER` (`demo` | `pse` | `directo`).

servers:
  - url: http://localhost:3001
    description: Desarrollo local

security:
  - bearerAuth: []

tags:
  - name: Sistema
  - name: Autenticación
  - name: Plataforma
  - name: Dashboard
  - name: Unidades
  - name: Choferes
  - name: Documentos
  - name: Vencimientos
  - name: Tickets

paths:
  /api/health:
    get:
      tags: [Sistema]
      summary: Estado del servicio (público)
      security: []
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
                  servicio: { type: string }
                  gre: { type: string, enum: [demo, pse, directo] }

  /api/auth/login:
    post:
      tags: [Autenticación]
      summary: Ingresar (público). Devuelve el token de sesión.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username, password]
              properties:
                username: { type: string, example: andina }
                password: { type: string, format: password, example: demo2026seguro }
      responses:
        "200":
          description: Credenciales válidas
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Sesion" }
        "401":
          description: Usuario o contraseña incorrectos
          content:
            application/json: { schema: { $ref: "#/components/schemas/Error" } }

  /api/auth/registro:
    post:
      tags: [Autenticación]
      summary: Crear un usuario en la misma empresa del admin *(admin)*
      responses:
        "201":
          description: Usuario creado
          content:
            application/json: { schema: { $ref: "#/components/schemas/UsuarioPublico" } }
        "400": { $ref: "#/components/responses/ErrorValidacion" }
        "401": { $ref: "#/components/responses/NoAutenticado" }
        "403": { $ref: "#/components/responses/SinPermiso" }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username, password, nombreCompleto]
              properties:
                username: { type: string }
                password: { type: string, format: password, minLength: 8 }
                nombreCompleto: { type: string }
                rol: { $ref: "#/components/schemas/RolUsuario" }

  /api/resumen:
    get:
      tags: [Plataforma]
      summary: Totales globales de todas las empresas *(superadmin)*
      responses:
        "200":
          description: Contadores agregados
          content:
            application/json: { schema: { $ref: "#/components/schemas/ResumenGlobal" } }
        "403": { $ref: "#/components/responses/SinPermiso" }

  /api/empresas:
    get:
      tags: [Plataforma]
      summary: Listar todas las empresas con su resumen *(superadmin)*
      responses:
        "200":
          description: Lista de empresas
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/EmpresaResumen" } }
        "403": { $ref: "#/components/responses/SinPermiso" }
    post:
      tags: [Plataforma]
      summary: Crear una empresa junto con su primer administrador *(superadmin)*
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/NuevaEmpresa" }
      responses:
        "201":
          description: Empresa y admin creados
          content:
            application/json: { schema: { $ref: "#/components/schemas/EmpresaCreada" } }
        "400": { $ref: "#/components/responses/ErrorValidacion" }
        "403": { $ref: "#/components/responses/SinPermiso" }

  /api/dashboard:
    get:
      tags: [Dashboard]
      summary: Indicadores de gestión del dashboard *(admin_empresa o superadmin)*
      description: >
        KPI (con variación vs. el período anterior) y series de apoyo,
        todo medido sobre una ventana móvil. `admin_empresa`: su empresa
        (del token). `superadmin`: `?empresaId=<uuid>` para una empresa, o
        sin él / `todas` para la vista acumulada de toda la plataforma.
      parameters:
        - name: ventana
          in: query
          required: false
          schema: { type: string, enum: [7d, 30d, 90d, 12m], default: 30d }
          description: Ventana móvil de medición (12m agrupa por mes; el resto por día).
        - name: empresaId
          in: query
          required: false
          schema: { type: string }
          description: "Solo superadmin: uuid de una empresa, o 'todas'. Ignorado para otros roles."
      responses:
        "200":
          description: Datos del dashboard
          content:
            application/json: { schema: { $ref: "#/components/schemas/Dashboard" } }
        "403": { $ref: "#/components/responses/SinPermiso" }

  /api/unidades:
    get:
      tags: [Unidades]
      summary: Listar las unidades de mi empresa
      description: >
        Un superadmin debe indicar `?empresaId=<uuid>` (obligatorio para
        ese rol; ignorado para los demás).
      parameters: [{ $ref: "#/components/parameters/EmpresaSuperadmin" }]
      responses:
        "200":
          description: Lista de unidades
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/Unidad" } }
        "401": { $ref: "#/components/responses/NoAutenticado" }
    post:
      tags: [Unidades]
      summary: Registrar una unidad *(admin)*
      description: >
        La unidad nace en `estadoRegistro: "PENDIENTE"` y no se puede usar
        para tickets hasta que el superadmin la libere. Obligatorios a
        nivel de datos: placa, rucPropietario, dniTransportista.
        **Además, esta operación exige** `vigenciaSoat`, `vigenciaCitv` y
        el PDF (base64, sin multipart) de 5 documentos —
        `archivoSoat`, `archivoCitv`, `archivoBrevete`, `archivoDni`,
        `archivoCategoriaMtc`, cada uno con su `*Nombre` opcional—; si
        falta alguno o no es un PDF válido (`%PDF-`, ≤5 MB), responde 400
        y no crea nada. Los archivos se guardan como documentos de la
        unidad: SOAT y REVISION_TECNICA (con `nroSoat`/`nroCitv` y su
        vencimiento) y BREVETE_TRANSPORTISTA / DNI_TRANSPORTISTA /
        CATEGORIA_MTC (solo el archivo, sin vencimiento). Si alguno de los
        5 falla al guardarse ya con la unidad creada, la respuesta trae
        `avisos` en vez de fallar toda la operación.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: "#/components/schemas/NuevaUnidad"
                - type: object
                  required: [vigenciaSoat, vigenciaCitv, archivoSoat, archivoCitv, archivoBrevete, archivoDni, archivoCategoriaMtc]
                  properties:
                    archivoSoat: { type: string, format: byte, description: "PDF en base64 (o data:application/pdf;base64,...)" }
                    archivoSoatNombre: { type: string, example: "soat.pdf" }
                    archivoCitv: { type: string, format: byte }
                    archivoCitvNombre: { type: string }
                    archivoBrevete: { type: string, format: byte }
                    archivoBreveteNombre: { type: string }
                    archivoDni: { type: string, format: byte }
                    archivoDniNombre: { type: string }
                    archivoCategoriaMtc: { type: string, format: byte }
                    archivoCategoriaMtcNombre: { type: string }
      responses:
        "201":
          description: Solicitud registrada (queda PENDIENTE)
          content:
            application/json: { schema: { $ref: "#/components/schemas/Unidad" } }
        "400": { $ref: "#/components/responses/ErrorValidacion" }
        "401": { $ref: "#/components/responses/NoAutenticado" }
        "403": { $ref: "#/components/responses/SinPermiso" }

  /api/unidades/pendientes:
    get:
      tags: [Unidades]
      summary: Solicitudes de registro pendientes de todas las empresas *(superadmin)*
      responses:
        "200":
          description: Unidades en estado PENDIENTE (con `empresaRazonSocial`)
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/Unidad" } }
        "401": { $ref: "#/components/responses/NoAutenticado" }
        "403": { $ref: "#/components/responses/SinPermiso" }

  /api/unidades/{id}:
    put:
      tags: [Unidades]
      summary: Editar la ficha de una unidad *(admin o superadmin)*
      description: >
        admin_empresa: solo su unidad y solo si está PENDIENTE o RECHAZADA;
        si estaba RECHAZADA, al guardar vuelve a PENDIENTE (reenvío).
        superadmin: cualquier unidad, sin cambiar el estado. Solo actualiza
        los campos de ficha que se envían (no borra los omitidos). No toca
        placa ni los documentos SOAT/CITV.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/NuevaUnidad" }
      responses:
        "200":
          description: Unidad actualizada
          content:
            application/json: { schema: { $ref: "#/components/schemas/Unidad" } }
        "400": { $ref: "#/components/responses/ErrorValidacion" }
        "401": { $ref: "#/components/responses/NoAutenticado" }
        "403": { $ref: "#/components/responses/SinPermiso" }

  /api/unidades/{id}/aprobar:
    post:
      tags: [Unidades]
      summary: Liberar una solicitud de registro *(superadmin)*
      description: Deja la unidad en `APROBADA`; recién ahí se puede usar para tickets.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: Unidad aprobada
          content:
            application/json: { schema: { $ref: "#/components/schemas/Unidad" } }
        "401": { $ref: "#/components/responses/NoAutenticado" }
        "403": { $ref: "#/components/responses/SinPermiso" }

  /api/unidades/{id}/rechazar:
    post:
      tags: [Unidades]
      summary: Rechazar una solicitud de registro con un motivo *(superadmin)*
      description: >
        Deja la unidad en `RECHAZADA` con `motivoRechazo`. El admin de la
        empresa puede corregir la ficha (PUT) y así vuelve a PENDIENTE.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [motivo]
              properties: { motivo: { type: string, example: "Falta el N° de CITV" } }
      responses:
        "200":
          description: Unidad rechazada
          content:
            application/json: { schema: { $ref: "#/components/schemas/Unidad" } }
        "400": { $ref: "#/components/responses/ErrorValidacion" }
        "401": { $ref: "#/components/responses/NoAutenticado" }
        "403": { $ref: "#/components/responses/SinPermiso" }

  /api/unidades/{id}/desactivar:
    post:
      tags: [Unidades]
      summary: Baja lógica de una unidad *(admin)*
      parameters: [{ $ref: "#/components/parameters/IdPath" }]
      responses:
        "200":
          description: Unidad desactivada
          content:
            application/json: { schema: { $ref: "#/components/schemas/Unidad" } }
        "400": { $ref: "#/components/responses/ErrorValidacion" }
        "403": { $ref: "#/components/responses/SinPermiso" }

  /api/unidades/{id}/documentos:
    get:
      tags: [Documentos]
      summary: Documentos de una unidad (SOAT, revisión técnica, ...)
      parameters: [{ $ref: "#/components/parameters/IdPath" }]
      responses:
        "200":
          description: Lista de documentos
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/DocumentoUnidad" } }
        "401": { $ref: "#/components/responses/NoAutenticado" }
    post:
      tags: [Documentos]
      summary: Agregar un documento a una unidad *(admin)*
      parameters: [{ $ref: "#/components/parameters/IdPath" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/NuevoDocumentoUnidad" }
      responses:
        "201":
          description: Documento agregado
          content:
            application/json: { schema: { $ref: "#/components/schemas/DocumentoUnidad" } }
        "400": { $ref: "#/components/responses/ErrorValidacion" }
        "403": { $ref: "#/components/responses/SinPermiso" }

  /api/unidades/{id}/documentos/{docId}:
    delete:
      tags: [Documentos]
      summary: Eliminar un documento de una unidad *(admin)*
      parameters:
        - { $ref: "#/components/parameters/IdPath" }
        - { name: docId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: Eliminado
          content:
            application/json: { schema: { type: object, properties: { ok: { type: boolean } } } }
        "400": { $ref: "#/components/responses/ErrorValidacion" }
        "403": { $ref: "#/components/responses/SinPermiso" }

  /api/unidades/{id}/documentos/{docId}/archivo:
    get:
      tags: [Documentos]
      summary: Descargar/ver el PDF adjunto de un documento de una unidad
      description: >
        Devuelve el binario del PDF (`Content-Type: application/pdf`,
        `Content-Disposition: inline`). 404 si el documento no tiene
        archivo guardado.
      parameters:
        - { $ref: "#/components/parameters/IdPath" }
        - { name: docId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: Contenido del PDF
          content:
            application/pdf: { schema: { type: string, format: binary } }
        "401": { $ref: "#/components/responses/NoAutenticado" }
        "403": { $ref: "#/components/responses/SinPermiso" }
        "404": { description: No existe el documento o no tiene archivo }

  /api/choferes:
    get:
      tags: [Choferes]
      summary: Listar los choferes de mi empresa
      parameters: [{ $ref: "#/components/parameters/EmpresaSuperadmin" }]
      responses:
        "200":
          description: Lista de choferes
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/Chofer" } }
        "401": { $ref: "#/components/responses/NoAutenticado" }
    post:
      tags: [Choferes]
      summary: Registrar un chofer *(admin)*
      description: >
        Nace en `estadoRegistro: "PENDIENTE"` y no se puede usar para
        tickets hasta que el superadmin lo libere. Obligatorios:
        tipoDocIdentidad, dni (nº de documento), primerNombre y
        apellidoPaterno. Si vienen brevete/claseCategoria/fechaExpedicion/
        fechaRevalidacion, se guardan como documento LICENCIA_CONDUCIR
        (si algo falla, el chofer igual se crea y la respuesta trae `avisos`).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/NuevoChofer" }
      responses:
        "201":
          description: Solicitud registrada (queda PENDIENTE)
          content:
            application/json: { schema: { $ref: "#/components/schemas/Chofer" } }
        "400": { $ref: "#/components/responses/ErrorValidacion" }
        "403": { $ref: "#/components/responses/SinPermiso" }

  /api/choferes/pendientes:
    get:
      tags: [Choferes]
      summary: Solicitudes de registro de choferes pendientes *(superadmin)*
      responses:
        "200":
          description: Choferes en estado PENDIENTE (con `empresaRazonSocial`)
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/Chofer" } }
        "403": { $ref: "#/components/responses/SinPermiso" }

  /api/choferes/{id}:
    put:
      tags: [Choferes]
      summary: Editar la ficha de un chofer *(admin o superadmin)*
      description: >
        admin_empresa: su chofer y solo si está PENDIENTE o RECHAZADA (si
        estaba rechazada, al guardar vuelve a PENDIENTE). superadmin:
        cualquiera, sin cambiar el estado. No toca el brevete (va por
        documentos).
      parameters: [{ $ref: "#/components/parameters/IdPath" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/NuevoChofer" }
      responses:
        "200":
          description: Chofer actualizado
          content:
            application/json: { schema: { $ref: "#/components/schemas/Chofer" } }
        "400": { $ref: "#/components/responses/ErrorValidacion" }
        "403": { $ref: "#/components/responses/SinPermiso" }

  /api/choferes/{id}/aprobar:
    post:
      tags: [Choferes]
      summary: Liberar una solicitud de registro de chofer *(superadmin)*
      parameters: [{ $ref: "#/components/parameters/IdPath" }]
      responses:
        "200":
          description: Chofer aprobado
          content:
            application/json: { schema: { $ref: "#/components/schemas/Chofer" } }
        "403": { $ref: "#/components/responses/SinPermiso" }

  /api/choferes/{id}/rechazar:
    post:
      tags: [Choferes]
      summary: Rechazar una solicitud de registro de chofer con un motivo *(superadmin)*
      parameters: [{ $ref: "#/components/parameters/IdPath" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [motivo]
              properties: { motivo: { type: string, example: "Falta el brevete" } }
      responses:
        "200":
          description: Chofer rechazado
          content:
            application/json: { schema: { $ref: "#/components/schemas/Chofer" } }
        "400": { $ref: "#/components/responses/ErrorValidacion" }
        "403": { $ref: "#/components/responses/SinPermiso" }

  /api/choferes/{id}/desactivar:
    post:
      tags: [Choferes]
      summary: Baja lógica de un chofer *(admin)*
      parameters: [{ $ref: "#/components/parameters/IdPath" }]
      responses:
        "200":
          description: Chofer desactivado
          content:
            application/json: { schema: { $ref: "#/components/schemas/Chofer" } }
        "403": { $ref: "#/components/responses/SinPermiso" }

  /api/choferes/{id}/documentos:
    get:
      tags: [Documentos]
      summary: Documentos de un chofer (licencia, certificado médico, ...)
      parameters: [{ $ref: "#/components/parameters/IdPath" }]
      responses:
        "200":
          description: Lista de documentos
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/DocumentoChofer" } }
        "401": { $ref: "#/components/responses/NoAutenticado" }
    post:
      tags: [Documentos]
      summary: Agregar un documento a un chofer *(admin)*
      parameters: [{ $ref: "#/components/parameters/IdPath" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/NuevoDocumentoChofer" }
      responses:
        "201":
          description: Documento agregado
          content:
            application/json: { schema: { $ref: "#/components/schemas/DocumentoChofer" } }
        "400": { $ref: "#/components/responses/ErrorValidacion" }
        "403": { $ref: "#/components/responses/SinPermiso" }

  /api/choferes/{id}/documentos/{docId}:
    delete:
      tags: [Documentos]
      summary: Eliminar un documento de un chofer *(admin)*
      parameters:
        - { $ref: "#/components/parameters/IdPath" }
        - { name: docId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: Eliminado
          content:
            application/json: { schema: { type: object, properties: { ok: { type: boolean } } } }
        "403": { $ref: "#/components/responses/SinPermiso" }

  /api/vencimientos:
    get:
      tags: [Vencimientos]
      summary: Documentos (de unidades y choferes) vencidos o por vencer
      parameters:
        - name: dias
          in: query
          required: false
          schema: { type: integer, default: 30, minimum: 1, maximum: 365 }
          description: Rango hacia adelante. Incluye también los ya vencidos.
        - { $ref: "#/components/parameters/EmpresaSuperadmin" }
      responses:
        "200":
          description: Lista ordenada por fecha de vencimiento
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/Vencimiento" } }
        "401": { $ref: "#/components/responses/NoAutenticado" }

  /api/catalogos:
    get:
      tags: [Tickets]
      summary: Listas para los desplegables del ticket, la unidad y el chofer
      description: >
        mercancias/centrosOrigen/destinos son cerrados (el ticket los
        valida). El resto son sugerencias para los formularios de unidad y
        chofer (no se validan).
      responses:
        "200":
          description: Las listas
          content:
            application/json:
              schema:
                type: object
                properties:
                  mercancias:
                    type: array
                    items: { $ref: "#/components/schemas/Mercancia" }
                  centrosOrigen:
                    type: array
                    items: { $ref: "#/components/schemas/CentroOrigen" }
                  destinos:
                    type: array
                    items: { $ref: "#/components/schemas/Destino" }
                  tiposVehiculo: { type: array, items: { type: string } }
                  tiposRodada: { type: array, items: { type: string } }
                  formasApertura: { type: array, items: { type: string } }
                  tiposDocIdentidad: { type: array, items: { type: string }, example: [DNI, CE, PASAPORTE] }
                  departamentos: { type: array, items: { type: string } }
                  categoriasLicencia: { type: array, items: { $ref: "#/components/schemas/CategoriaLicencia" } }

  /api/consulta/ruc/{ruc}:
    get:
      tags: [Unidades]
      summary: Autocompletar datos del dueño por RUC (SUNAT)
      description: >
        Todavía sin proveedor externo: responde `{ "configurado": false }`.
        Ver src/consulta/consultaIdentidad.js.
      parameters:
        - { name: ruc, in: path, required: true, schema: { type: string, pattern: "^[0-9]{11}$" } }
      responses:
        "200":
          description: Datos del RUC, o { configurado:false } si no hay proveedor
          content:
            application/json:
              schema:
                oneOf:
                  - type: object
                    properties: { configurado: { const: false } }
                  - type: object
                    properties:
                      configurado: { const: true }
                      ruc: { type: string }
                      nombre: { type: string }
                      direccion: { type: [string, "null"] }
        "401": { $ref: "#/components/responses/NoAutenticado" }

  /api/consulta/dni/{dni}:
    get:
      tags: [Unidades]
      summary: Autocompletar ubicación del transportista por DNI (RENIEC)
      description: >
        Todavía sin proveedor externo: responde `{ "configurado": false }`.
      parameters:
        - { name: dni, in: path, required: true, schema: { type: string, pattern: "^[0-9]{8}$" } }
      responses:
        "200":
          description: Datos del DNI, o { configurado:false } si no hay proveedor
          content:
            application/json:
              schema:
                oneOf:
                  - type: object
                    properties: { configurado: { const: false } }
                  - type: object
                    properties:
                      configurado: { const: true }
                      dni: { type: string }
                      nombres: { type: string }
                      apellidos: { type: string }
                      departamento: { type: [string, "null"] }
                      provincia: { type: [string, "null"] }
                      distrito: { type: [string, "null"] }
        "401": { $ref: "#/components/responses/NoAutenticado" }
        "401": { $ref: "#/components/responses/NoAutenticado" }

  /api/tickets:
    get:
      tags: [Tickets]
      summary: Listar los tickets de mi empresa (más recientes primero)
      parameters: [{ $ref: "#/components/parameters/EmpresaSuperadmin" }]
      responses:
        "200":
          description: Lista de tickets
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/Ticket" } }
        "401": { $ref: "#/components/responses/NoAutenticado" }
    post:
      tags: [Tickets]
      summary: Crear un ticket y disparar la emisión de la GRE
      description: >
        La unidad y el chofer deben estar registrados, ser de mi empresa
        y estar activos. `creadoPor` se toma del token. Responde antes de
        que SUNAT conteste (`estadoSunat: "ENVIANDO"`).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/NuevoTicket" }
      responses:
        "201":
          description: Ticket creado (emisión en curso)
          content:
            application/json: { schema: { $ref: "#/components/schemas/Ticket" } }
        "400": { $ref: "#/components/responses/ErrorValidacion" }
        "401": { $ref: "#/components/responses/NoAutenticado" }

  /api/tickets/{id}:
    get:
      tags: [Tickets]
      summary: Detalle de un ticket (con el estado actual de su GRE)
      parameters: [{ $ref: "#/components/parameters/IdPath" }]
      responses:
        "200":
          description: Ticket encontrado
          content:
            application/json: { schema: { $ref: "#/components/schemas/Ticket" } }
        "404":
          description: No encontrado (o de otra empresa)
          content:
            application/json: { schema: { $ref: "#/components/schemas/Error" } }

  /api/tickets/{id}/historial:
    get:
      tags: [Tickets]
      summary: Historial de cambios de estado operativo de un ticket
      description: >
        Línea de tiempo ordenada cronológicamente (una fila por cambio de
        `estadoOperativo`, incluida la creación del ticket), con el
        usuario que hizo cada cambio si se pudo identificar.
      parameters: [{ $ref: "#/components/parameters/IdPath" }]
      responses:
        "200":
          description: Historial del ticket
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    estadoAnterior: { type: [string, "null"] }
                    estadoNuevo: { type: string }
                    usuarioId: { type: [string, "null"], format: uuid }
                    usuarioNombre: { type: [string, "null"] }
                    creadoEn: { type: string, format: date-time }
        "401": { $ref: "#/components/responses/NoAutenticado" }
        "404":
          description: No encontrado (o de otra empresa)
          content:
            application/json: { schema: { $ref: "#/components/schemas/Error" } }

  /api/tickets/{id}/avanzar:
    post:
      tags: [Tickets]
      summary: Cambiar el estado operativo del ticket
      description: >
        Solo se puede pasar a `EN_TRANSITO` o `ENTREGADO` si la GRE fue
        `ACEPTADO`. `ANULADO` se permite salvo que ya esté anulado. Marca
        `fechaTraslado` / `fechaEntrega` y deja registro en el historial.
      parameters: [{ $ref: "#/components/parameters/IdPath" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [estadoOperativo]
              properties:
                estadoOperativo: { $ref: "#/components/schemas/EstadoOperativo" }
      responses:
        "200":
          description: Estado actualizado
          content:
            application/json: { schema: { $ref: "#/components/schemas/Ticket" } }
        "400": { $ref: "#/components/responses/ErrorValidacion" }
        "404":
          description: No encontrado (o de otra empresa)
          content:
            application/json: { schema: { $ref: "#/components/schemas/Error" } }

  /api/viajes-programados:
    get:
      tags: [Programación]
      summary: Listar los viajes programados de mi empresa
      description: >
        Agenda previa (opcional) de qué unidad/chofer va a qué ruta un día
        dado; no crea el ticket, es solo un paso previo de planificación.
        Ordenados por fecha programada.
      responses:
        "200":
          description: Lista de viajes programados
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/ViajeProgramado" } }
        "401": { $ref: "#/components/responses/NoAutenticado" }
    post:
      tags: [Programación]
      summary: Programar un viaje *(admin/operador)*
      description: >
        La unidad y el chofer deben existir, pertenecer a mi empresa y
        estar APROBADA/activa. `origen`, `destino` y `descripcionMercancia`
        (opcional) salen del mismo catálogo fijo que usan los tickets.
        Rechaza (400) si la unidad o el chofer ya tienen otro viaje
        `PROGRAMADO` para la misma `fechaProgramada`.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/NuevoViajeProgramado" }
      responses:
        "201":
          description: Viaje programado
          content:
            application/json: { schema: { $ref: "#/components/schemas/ViajeProgramado" } }
        "400": { $ref: "#/components/responses/ErrorValidacion" }
        "401": { $ref: "#/components/responses/NoAutenticado" }
        "403": { $ref: "#/components/responses/SinPermiso" }

  /api/viajes-programados/{id}/cumplir:
    post:
      tags: [Programación]
      summary: Marcar un viaje programado como cumplido *(admin/operador)*
      description: Solo si está en estado `PROGRAMADO`.
      parameters: [{ $ref: "#/components/parameters/IdPath" }]
      responses:
        "200":
          description: Viaje actualizado
          content:
            application/json: { schema: { $ref: "#/components/schemas/ViajeProgramado" } }
        "400": { $ref: "#/components/responses/ErrorValidacion" }
        "403": { $ref: "#/components/responses/SinPermiso" }

  /api/viajes-programados/{id}/cancelar:
    post:
      tags: [Programación]
      summary: Cancelar un viaje programado *(admin/operador)*
      description: Solo si está en estado `PROGRAMADO`. `motivo` es opcional.
      parameters: [{ $ref: "#/components/parameters/IdPath" }]
      requestBody:
        content:
          application/json:
            schema: { type: object, properties: { motivo: { type: [string, "null"] } } }
      responses:
        "200":
          description: Viaje actualizado
          content:
            application/json: { schema: { $ref: "#/components/schemas/ViajeProgramado" } }
        "400": { $ref: "#/components/responses/ErrorValidacion" }
        "403": { $ref: "#/components/responses/SinPermiso" }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: Token devuelto por POST /api/auth/login

  parameters:
    IdPath:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }
    EmpresaSuperadmin:
      name: empresaId
      in: query
      required: false
      description: Obligatorio si el token es de un superadmin; ignorado para otros roles.
      schema: { type: string, format: uuid }

  responses:
    ErrorValidacion:
      description: Datos inválidos o regla de negocio no cumplida
      content:
        application/json: { schema: { $ref: "#/components/schemas/Error" } }
    NoAutenticado:
      description: Falta el token o expiró
      content:
        application/json: { schema: { $ref: "#/components/schemas/Error" } }
    SinPermiso:
      description: El rol del usuario no permite esta acción
      content:
        application/json: { schema: { $ref: "#/components/schemas/Error" } }

  schemas:
    Error:
      type: object
      properties:
        error: { type: string, example: "Faltan campos obligatorios: origen, destino" }

    RolUsuario: { type: string, enum: [admin_empresa, operador, superadmin] }
    CategoriaMtc: { type: string, enum: [N1, N2, N3] }
    ConfiguracionVehicular:
      type: string
      description: Código del Anexo IV del RNV (DS 058-2003-MTC).
      enum: [C2, C2R2, C2R3, C3, C3R2, C3R3, C4, T2S1, T2S2, T2S3, T3S1, T3S2, T3S3]
    MotivoTraslado: { type: string, enum: [VENTA, TRASLADO_ENTRE_ESTABLECIMIENTOS, OTROS] }
    # Catálogos fijos de TransGuía (no los exige SUNAT; estandarizan el
    # dashboard). Se aceptan sin distinguir mayúsculas/tildes/espacios de
    # más y se guardan en su forma canónica. Fuente: GET /api/catalogos.
    Mercancia:
      type: string
      enum:
        - Carbón Trujillo
        - Caliza Roca Fuerte
        - Silice de Terceros
        - Puzolana Terceros
        - Puzolana Ayacucho
    CentroOrigen:
      type: string
      description: Patio/centro desde donde sale la carga (campo "origen" del ticket).
      enum: [Quri, Transmilsa, Atipax, Juscamaita]
    Destino:
      type: string
      description: Planta o punto de entrega (campo "destino" del ticket).
      enum: [Atocongo, Condorcocha, Muelle Conchán]
    EstadoOperativo: { type: string, enum: [GENERADO, EN_TRANSITO, ENTREGADO, ANULADO] }
    EstadoSunat: { type: string, enum: [ENVIANDO, ACEPTADO, RECHAZADO, OBSERVADO] }
    TipoDocumentoUnidad: { type: string, enum: [SOAT, REVISION_TECNICA, TARJETA_CIRCULACION, PERMISO_OPERACION, DNI_TRANSPORTISTA, BREVETE_TRANSPORTISTA, CATEGORIA_MTC, OTRO] }
    TipoDocumentoChofer: { type: string, enum: [LICENCIA_CONDUCIR, CERTIFICADO_MEDICO, OTRO] }
    CategoriaLicencia: { type: string, enum: ["A-I", "A-IIa", "A-IIb", "A-IIIa", "A-IIIb", "A-IIIc"] }

    UsuarioPublico:
      type: object
      properties:
        id: { type: string, format: uuid }
        username: { type: string }
        nombreCompleto: { type: string }
        rol: { $ref: "#/components/schemas/RolUsuario" }

    Sesion:
      type: object
      properties:
        id: { type: string, format: uuid }
        empresaId: { type: [string, "null"], format: uuid, description: "null para un superadmin" }
        username: { type: string }
        nombreCompleto: { type: string }
        rol: { $ref: "#/components/schemas/RolUsuario" }
        token: { type: string, description: "Enviar como 'Authorization: Bearer <token>'" }
        expiraEnMs: { type: integer, example: 43200000 }

    ResumenGlobal:
      type: object
      properties:
        empresas: { type: integer }
        unidadesActivas: { type: integer }
        choferesActivos: { type: integer }
        tickets: { type: integer }
        ticketsGenerados: { type: integer }
        ticketsEnTransito: { type: integer }
        ticketsEntregados: { type: integer }
        documentosVencidos: { type: integer }

    EmpresaResumen:
      type: object
      properties:
        id: { type: string, format: uuid }
        ruc: { type: string }
        razonSocial: { type: string }
        creadoEn: { type: string, format: date-time }
        unidadesActivas: { type: integer }
        choferesActivos: { type: integer }
        tickets: { type: integer }
        ticketsEnTransito: { type: integer }
        documentosVencidos: { type: integer }

    NuevaEmpresa:
      type: object
      required: [ruc, razonSocial, admin]
      properties:
        ruc: { type: string, pattern: "^[0-9]{11}$", example: "20512345678" }
        razonSocial: { type: string, example: "Transportes El Sol S.A.C." }
        admin:
          type: object
          required: [username, password, nombreCompleto]
          properties:
            username: { type: string }
            password: { type: string, format: password, minLength: 8 }
            nombreCompleto: { type: string }

    EmpresaCreada:
      type: object
      properties:
        empresa:
          type: object
          properties:
            id: { type: string, format: uuid }
            ruc: { type: string }
            razonSocial: { type: string }
            creadoEn: { type: string, format: date-time }
        admin: { $ref: "#/components/schemas/UsuarioPublico" }

    Kpi:
      type: object
      description: >
        Un indicador. `valor` es el del período; `delta` la variación % vs.
        el período previo (o `deltaPuntos` en puntos porcentuales), null si
        no hay base comparable. `subirEsBueno` dice de qué color pintar la
        variación. `semaforo` (bien|atencion|critico) solo en los de meta.
      properties:
        valor: { type: [number, "null"] }
        unidad: { type: string, example: "t" }
        delta: { type: [number, "null"] }
        deltaPuntos: { type: [number, "null"] }
        subirEsBueno: { type: boolean }
        semaforo: { type: string, enum: [bien, atencion, critico, sinDatos] }

    Dashboard:
      type: object
      properties:
        alcance: { type: string, example: "Todas las empresas" }
        ventana: { type: string, enum: [7d, 30d, 90d, 12m] }
        ventanaLabel: { type: string, example: "últimos 30 días" }
        mensual: { type: boolean }
        kpis:
          type: object
          description: 7 indicadores (ver schema Kpi). cicloHoras trae además `despacho`/`transito`; los de flota/GRE/cumplimiento traen sus contadores.
          properties:
            toneladas: { $ref: "#/components/schemas/Kpi" }
            viajes: { $ref: "#/components/schemas/Kpi" }
            cicloHoras: { $ref: "#/components/schemas/Kpi" }
            tasaAnulacion: { $ref: "#/components/schemas/Kpi" }
            utilizacionFlota: { $ref: "#/components/schemas/Kpi" }
            greAceptada: { $ref: "#/components/schemas/Kpi" }
            cumplimientoProgramacion:
              description: >
                % de viajes ENTREGADO (por fecha de entrega real) sobre los
                viajes_programados con fecha en la ventana (sin contar
                cancelados). Trae `entregados`/`programados`. No hay
                vínculo 1 a 1 entre un viaje programado y un ticket
                puntual: es una lectura agregada de plan vs. ejecución,
                `null`/`sinDatos` si no hubo nada programado en la ventana.
              allOf: [{ $ref: "#/components/schemas/Kpi" }]
        toneladasPorPeriodo:
          type: array
          items:
            type: object
            properties:
              periodo: { type: string, example: "2026-09-08" }
              toneladas: { type: number }
              viajes: { type: integer }
        porEstadoOperativo:
          type: object
          properties:
            GENERADO: { type: integer }
            EN_TRANSITO: { type: integer }
            ENTREGADO: { type: integer }
            ANULADO: { type: integer }
        toneladasPorMaterial:
          type: array
          items:
            type: object
            properties:
              material: { $ref: "#/components/schemas/Mercancia" }
              toneladas: { type: number, example: 24.6 }
              viajes: { type: integer }
        viajesPorUnidad:
          type: array
          items:
            type: object
            properties:
              placa: { type: string, example: "ABC-756" }
              viajes: { type: integer }
              toneladas: { type: number }
        viajesPorChofer:
          type: array
          description: Los 10 choferes con más viajes en la ventana.
          items:
            type: object
            properties:
              chofer: { type: string, example: "Luis Alberto Quispe Mamani" }
              viajes: { type: integer }
              toneladas: { type: number }
        corredores:
          type: array
          description: Toneladas y viajes por par centro de origen → destino.
          items:
            type: object
            properties:
              origen: { $ref: "#/components/schemas/CentroOrigen" }
              destino: { $ref: "#/components/schemas/Destino" }
              toneladas: { type: number }
              viajes: { type: integer }

    NuevaUnidad:
      type: object
      description: >
        Solo placa, rucPropietario y dniTransportista son obligatorios a
        nivel de datos; el resto de la ficha se puede completar después.
        Los campos "autocompletados" (nombrePropietario,
        direccionPropietario, departamento, provincia, distrito) hoy se
        cargan a mano. nroSoat/vigenciaSoat y nroCitv/vigenciaCitv NO se
        guardan en la unidad: se registran como documentos con vencimiento
        (tipo SOAT y REVISION_TECNICA). **`POST /api/unidades` además
        exige** vigenciaSoat, vigenciaCitv y los 5 archivos
        archivoSoat/archivoCitv/archivoBrevete/archivoDni/
        archivoCategoriaMtc (ver la descripción de esa operación) — ese
        candado vive en la ruta, no en este schema, así que un PUT de
        edición o una siembra interna no lo exige.
      required: [placa, rucPropietario, dniTransportista]
      properties:
        placa: { type: string, description: "3 letras + 3 dígitos; se normaliza a ABC-123", example: ABC-756 }
        rucPropietario: { type: string, pattern: "^[0-9]{11}$", description: "RUC del dueño del vehículo" }
        nombrePropietario: { type: string }
        direccionPropietario: { type: string }
        dniTransportista: { type: string, pattern: "^[0-9]{8}$", description: "DNI del transportista responsable" }
        departamento: { type: string }
        provincia: { type: string }
        distrito: { type: string }
        tipoVehiculo: { type: string, description: "Ver GET /api/catalogos → tiposVehiculo" }
        marca: { type: string, example: Volvo }
        modelo: { type: string, example: "FH 460" }
        anioFabricacion: { type: [integer, "null"], minimum: 1970, example: 2021 }
        categoriaMtc: { $ref: "#/components/schemas/CategoriaMtc" }
        configuracionVehicular: { $ref: "#/components/schemas/ConfiguracionVehicular" }
        nroEjes: { type: integer, minimum: 2, maximum: 12, example: 3 }
        rodadaEjeDelantero: { type: string, description: "Ver GET /api/catalogos → tiposRodada" }
        rodadaC1: { type: string }
        rodadaC2: { type: string }
        pesoSecoKg: { type: number, example: 14500 }
        tolvaCerrada: { type: boolean, description: "Acepta true/false o \"SI\"/\"NO\"" }
        carretaConPiston: { type: boolean }
        unidadAGas: { type: boolean }
        formaApertura: { type: string, description: "Ver GET /api/catalogos → formasApertura" }
        alturaM: { type: number, example: 3.20 }
        anchoM: { type: number, example: 2.60 }
        largoM: { type: number, example: 12.30 }
        alturaPlataformaM: { type: number, example: 1.20 }
        nroSoat: { type: string }
        vigenciaSoat: { type: string, format: date }
        nroCitv: { type: string }
        vigenciaCitv: { type: string, format: date }

    EstadoRegistro:
      type: string
      description: >
        PENDIENTE: la cargó el admin, falta que la plataforma la libere.
        APROBADA: liberada por el superadmin, ya se puede usar para tickets.
        RECHAZADA: el superadmin la rechazó (ver motivoRechazo); el admin
        puede corregirla y vuelve a PENDIENTE.
      enum: [PENDIENTE, APROBADA, RECHAZADA]

    Unidad:
      description: >
        Como NuevaUnidad (sin nroSoat/vigenciaSoat/nroCitv/vigenciaCitv,
        que viven en documentos_unidad) más id, empresaId, activo, creadoEn
        y el estado de aprobación. En un alta con SOAT/CITV mal cargados,
        la respuesta incluye `avisos`. En GET /api/unidades/pendientes
        también trae `empresaRazonSocial`.
      allOf:
        - $ref: "#/components/schemas/NuevaUnidad"
        - type: object
          properties:
            id: { type: string, format: uuid }
            empresaId: { type: string, format: uuid }
            activo: { type: boolean }
            creadoEn: { type: string, format: date-time }
            estadoRegistro: { $ref: "#/components/schemas/EstadoRegistro" }
            motivoRechazo: { type: [string, "null"] }
            revisadoPor: { type: [string, "null"], format: uuid }
            revisadoEn: { type: [string, "null"], format: date-time }
            empresaRazonSocial: { type: string }
            avisos: { type: array, items: { type: string } }

    NuevoChofer:
      type: object
      description: >
        Obligatorios: tipoDocIdentidad, dni, primerNombre, apellidoPaterno.
        `departamento` sale de GET /api/catalogos → departamentos;
        provincia/distrito todavía son texto libre. Los 4 campos de nombre
        se pueden autocompletar por DNI (RENIEC) más adelante. Como compat
        se aceptan `nombres`/`apellidos` sueltos y el servicio los parte.
        brevete/claseCategoria/fechaExpedicion/fechaRevalidacion NO se
        guardan en el chofer: van como documento LICENCIA_CONDUCIR.
      required: [tipoDocIdentidad, dni, primerNombre, apellidoPaterno]
      properties:
        tipoDocIdentidad: { type: string, enum: [DNI, CE, PASAPORTE] }
        dni: { type: string, description: "N° de documento. DNI = 8 dígitos; CE/pasaporte = 6-15 alfanumérico", example: "45678912" }
        apellidoPaterno: { type: string }
        apellidoMaterno: { type: string }
        primerNombre: { type: string }
        segundoNombre: { type: string }
        celular: { type: string }
        departamento: { type: string }
        provincia: { type: string }
        distrito: { type: string }
        direccion: { type: string }
        brevete: { type: string, description: "N° de licencia; se guarda como documento" }
        claseCategoria: { $ref: "#/components/schemas/CategoriaLicencia" }
        fechaExpedicion: { type: string, format: date }
        fechaRevalidacion: { type: string, format: date }

    Chofer:
      description: >
        Como NuevoChofer (sin los 4 campos de brevete, que viven en
        documentos_chofer) más id, empresaId, activo, creadoEn, el estado
        de aprobación y `nombres`/`apellidos` (el nombre "para mostrar" que
        arma el servicio). En GET /api/choferes/pendientes trae también
        `empresaRazonSocial`; en un alta con brevete mal cargado, `avisos`.
      allOf:
        - $ref: "#/components/schemas/NuevoChofer"
        - type: object
          properties:
            id: { type: string, format: uuid }
            empresaId: { type: string, format: uuid }
            nombres: { type: string }
            apellidos: { type: string }
            activo: { type: boolean }
            creadoEn: { type: string, format: date-time }
            estadoRegistro: { $ref: "#/components/schemas/EstadoRegistro" }
            motivoRechazo: { type: [string, "null"] }
            revisadoPor: { type: [string, "null"], format: uuid }
            revisadoEn: { type: [string, "null"], format: date-time }
            empresaRazonSocial: { type: string }
            avisos: { type: array, items: { type: string } }

    NuevoDocumentoUnidad:
      type: object
      description: >
        `fechaVencimiento` es obligatoria salvo para DNI_TRANSPORTISTA,
        BREVETE_TRANSPORTISTA y CATEGORIA_MTC (documentos sin vencimiento
        que solo llevan el archivo).
      required: [tipoDocumento]
      properties:
        tipoDocumento: { $ref: "#/components/schemas/TipoDocumentoUnidad" }
        numeroDocumento: { type: [string, "null"] }
        fechaEmision: { type: [string, "null"], format: date, example: "2025-01-15" }
        fechaVencimiento: { type: [string, "null"], format: date, example: "2026-12-31" }
        archivoUrl: { type: [string, "null"] }

    DocumentoUnidad:
      allOf:
        - $ref: "#/components/schemas/NuevoDocumentoUnidad"
        - type: object
          properties:
            id: { type: string, format: uuid }
            unidadId: { type: string, format: uuid }
            archivoNombre: { type: [string, "null"], description: "Nombre original del PDF subido, si tiene." }
            tieneArchivo: { type: boolean, description: "true si el documento tiene un PDF guardado (descargable en /archivo)." }
            creadoEn: { type: string, format: date-time }

    NuevoDocumentoChofer:
      type: object
      required: [tipoDocumento, fechaVencimiento]
      properties:
        tipoDocumento: { $ref: "#/components/schemas/TipoDocumentoChofer" }
        numeroDocumento: { type: [string, "null"] }
        categoriaLicencia:
          description: Solo para LICENCIA_CONDUCIR.
          oneOf:
            - $ref: "#/components/schemas/CategoriaLicencia"
            - type: "null"
        fechaEmision: { type: [string, "null"], format: date }
        fechaVencimiento: { type: string, format: date }

    DocumentoChofer:
      allOf:
        - $ref: "#/components/schemas/NuevoDocumentoChofer"
        - type: object
          properties:
            id: { type: string, format: uuid }
            choferId: { type: string, format: uuid }
            creadoEn: { type: string, format: date-time }

    Vencimiento:
      type: object
      properties:
        tipo: { type: string, enum: [unidad, chofer] }
        referencia: { type: string, description: "Placa de la unidad o nombre del chofer", example: ABC-756 }
        documento: { type: string, example: SOAT }
        fechaVencimiento: { type: string, format: date }
        diasRestantes: { type: integer, description: "Negativo si ya venció", example: -5 }

    NuevoTicket:
      type: object
      required: [unidadId, choferId, origen, destino, descripcionMercancia, pesoBrutoKg]
      properties:
        unidadId: { type: string, format: uuid }
        choferId: { type: string, format: uuid }
        origen: { $ref: "#/components/schemas/CentroOrigen" }
        destino: { $ref: "#/components/schemas/Destino" }
        motivo:
          description: "Texto libre también aceptado; se traduce al enum (vacío → VENTA)."
          oneOf:
            - $ref: "#/components/schemas/MotivoTraslado"
            - type: string
        descripcionMercancia: { $ref: "#/components/schemas/Mercancia" }
        pesoBrutoKg: { type: number, exclusiveMinimum: 0, example: 8200 }

    Ticket:
      type: object
      properties:
        id: { type: string, format: uuid }
        codigoInterno: { type: string, example: TCK-000001 }
        empresaId: { type: string, format: uuid }
        unidadId: { type: string, format: uuid }
        choferId: { type: string, format: uuid }
        placa: { type: string, example: ABC-756 }
        configuracionVehicular: { $ref: "#/components/schemas/ConfiguracionVehicular" }
        choferDni: { type: string, example: "45678912" }
        choferNombres: { type: string, example: "Luis Alberto Quispe Mamani" }
        origen: { $ref: "#/components/schemas/CentroOrigen" }
        destino: { $ref: "#/components/schemas/Destino" }
        motivo: { $ref: "#/components/schemas/MotivoTraslado" }
        descripcionMercancia: { $ref: "#/components/schemas/Mercancia" }
        pesoBrutoKg: { type: number }
        estadoOperativo: { $ref: "#/components/schemas/EstadoOperativo" }
        estadoSunat: { $ref: "#/components/schemas/EstadoSunat" }
        serieCorrelativoGre: { type: [string, "null"], example: T001-000160 }
        motivoRechazo: { type: [string, "null"] }
        creadoPor: { type: [string, "null"], format: uuid, description: "Usuario que creó el ticket (del token)" }
        fechaTraslado: { type: [string, "null"], format: date-time }
        fechaEntrega: { type: [string, "null"], format: date-time }
        creadoEn: { type: string, format: date-time }

    NuevoViajeProgramado:
      type: object
      required: [unidadId, choferId, fechaProgramada, origen, destino]
      properties:
        unidadId: { type: string, format: uuid }
        choferId: { type: string, format: uuid }
        fechaProgramada: { type: string, format: date, example: "2026-09-25" }
        origen: { $ref: "#/components/schemas/CentroOrigen" }
        destino: { $ref: "#/components/schemas/Destino" }
        descripcionMercancia:
          description: Opcional; si viene, debe ser una del catálogo de mercancías.
          oneOf:
            - $ref: "#/components/schemas/Mercancia"
            - type: "null"
        observaciones: { type: [string, "null"] }

    ViajeProgramado:
      allOf:
        - $ref: "#/components/schemas/NuevoViajeProgramado"
        - type: object
          properties:
            id: { type: string, format: uuid }
            empresaId: { type: string, format: uuid }
            placa: { type: string, example: ABC-756 }
            choferNombre: { type: string, example: "Pedro Martín Alva Rojas" }
            choferDni: { type: string, example: "70110234" }
            estado:
              type: string
              enum: [PROGRAMADO, CUMPLIDO, CANCELADO]
            motivoCancelacion: { type: [string, "null"] }
            creadoPor: { type: [string, "null"], format: uuid }
            creadoEn: { type: string, format: date-time }
