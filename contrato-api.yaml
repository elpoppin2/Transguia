openapi: 3.1.0

info:
  title: TransGuía — API
  version: "0.2.0"
  description: >
    API del backend de TransGuía: autenticación, registro de unidades y
    choferes según normativa del MTC, documentos con vencimiento, y
    tickets de traslado vinculados a la GRE-Transportista de SUNAT.

    ## Autenticación

    Todas las rutas exigen un token de sesión salvo `POST /api/auth/login`
    y `GET /api/health`. El token se obtiene en el login y se envía en la
    cabecera `Authorization: Bearer <token>`. Dura 12 horas.

    El `empresaId` sale SIEMPRE del token: no se envía en la query ni en
    el cuerpo, y un usuario nunca ve datos de otra empresa.

    ## Roles

    - `operador`: crea y mueve tickets.
    - `admin_empresa`: además registra unidades, choferes, documentos y
      usuarios. Las rutas marcadas *(admin)* devuelven 403 para un operador.
    - `superadmin`: rol de plataforma, sin empresa propia. Ve todas las
      empresas (`/api/empresas`, `/api/resumen`) y consulta los datos de
      una empresa cualquiera pasando `?empresaId=<uuid>` en las rutas de
      lectura. No puede escribir datos de empresa (403 en las rutas *(admin)*
      y en crear/avanzar tickets). Rutas *(superadmin)*: 403 para los demás.

    ## Emisión de la GRE

    Es asíncrona: `POST /api/tickets` responde con
    `estadoSunat: "ENVIANDO"`; hay que consultar `GET /api/tickets/{id}`
    hasta que cambie a `ACEPTADO`, `RECHAZADO` u `OBSERVADO`. El proveedor
    se elige con `GRE_PROVIDER` (`demo` | `pse` | `directo`).

servers:
  - url: http://localhost:3001
    description: Desarrollo local

security:
  - bearerAuth: []

tags:
  - name: Sistema
  - name: Autenticación
  - name: Plataforma
  - name: Dashboard
  - name: Unidades
  - name: Choferes
  - name: Documentos
  - name: Vencimientos
  - name: Tickets

paths:
  /api/health:
    get:
      tags: [Sistema]
      summary: Estado del servicio (público)
      security: []
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
                  servicio: { type: string }
                  gre: { type: string, enum: [demo, pse, directo] }

  /api/auth/login:
    post:
      tags: [Autenticación]
      summary: Ingresar (público). Devuelve el token de sesión.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username, password]
              properties:
                username: { type: string, example: andina }
                password: { type: string, format: password, example: demo2026seguro }
      responses:
        "200":
          description: Credenciales válidas
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Sesion" }
        "401":
          description: Usuario o contraseña incorrectos
          content:
            application/json: { schema: { $ref: "#/components/schemas/Error" } }

  /api/auth/registro:
    post:
      tags: [Autenticación]
      summary: Crear un usuario en la misma empresa del admin *(admin)*
      responses:
        "201":
          description: Usuario creado
          content:
            application/json: { schema: { $ref: "#/components/schemas/UsuarioPublico" } }
        "400": { $ref: "#/components/responses/ErrorValidacion" }
        "401": { $ref: "#/components/responses/NoAutenticado" }
        "403": { $ref: "#/components/responses/SinPermiso" }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username, password, nombreCompleto]
              properties:
                username: { type: string }
                password: { type: string, format: password, minLength: 8 }
                nombreCompleto: { type: string }
                rol: { $ref: "#/components/schemas/RolUsuario" }

  /api/resumen:
    get:
      tags: [Plataforma]
      summary: Totales globales de todas las empresas *(superadmin)*
      responses:
        "200":
          description: Contadores agregados
          content:
            application/json: { schema: { $ref: "#/components/schemas/ResumenGlobal" } }
        "403": { $ref: "#/components/responses/SinPermiso" }

  /api/empresas:
    get:
      tags: [Plataforma]
      summary: Listar todas las empresas con su resumen *(superadmin)*
      responses:
        "200":
          description: Lista de empresas
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/EmpresaResumen" } }
        "403": { $ref: "#/components/responses/SinPermiso" }
    post:
      tags: [Plataforma]
      summary: Crear una empresa junto con su primer administrador *(superadmin)*
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/NuevaEmpresa" }
      responses:
        "201":
          description: Empresa y admin creados
          content:
            application/json: { schema: { $ref: "#/components/schemas/EmpresaCreada" } }
        "400": { $ref: "#/components/responses/ErrorValidacion" }
        "403": { $ref: "#/components/responses/SinPermiso" }

  /api/dashboard:
    get:
      tags: [Dashboard]
      summary: Métricas para el dashboard *(admin_empresa o superadmin)*
      description: >
        `admin_empresa`: su empresa (del token). `superadmin`:
        `?empresaId=<uuid>` para una empresa, o sin él / `todas` para la
        vista acumulada de toda la plataforma.
      parameters:
        - name: agrupar
          in: query
          required: false
          schema: { type: string, enum: [dia, mes], default: dia }
          description: Agrupación del gráfico de traslados por período.
        - name: empresaId
          in: query
          required: false
          schema: { type: string }
          description: "Solo superadmin: uuid de una empresa, o 'todas'. Ignorado para otros roles."
      responses:
        "200":
          description: Datos del dashboard
          content:
            application/json: { schema: { $ref: "#/components/schemas/Dashboard" } }
        "403": { $ref: "#/components/responses/SinPermiso" }

  /api/unidades:
    get:
      tags: [Unidades]
      summary: Listar las unidades de mi empresa
      description: >
        Un superadmin debe indicar `?empresaId=<uuid>` (obligatorio para
        ese rol; ignorado para los demás).
      parameters: [{ $ref: "#/components/parameters/EmpresaSuperadmin" }]
      responses:
        "200":
          description: Lista de unidades
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/Unidad" } }
        "401": { $ref: "#/components/responses/NoAutenticado" }
    post:
      tags: [Unidades]
      summary: Registrar una unidad *(admin)*
      description: >
        Obligatorios: placa, rucPropietario, dniTransportista. Si vienen
        nroSoat/vigenciaSoat o nroCitv/vigenciaCitv, se crean como
        documentos de la unidad (tipos SOAT y REVISION_TECNICA); si alguno
        está mal cargado, la unidad igual se crea y la respuesta trae `avisos`.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/NuevaUnidad" }
      responses:
        "201":
          description: Unidad registrada
          content:
            application/json: { schema: { $ref: "#/components/schemas/Unidad" } }
        "400": { $ref: "#/components/responses/ErrorValidacion" }
        "401": { $ref: "#/components/responses/NoAutenticado" }
        "403": { $ref: "#/components/responses/SinPermiso" }

  /api/unidades/{id}/desactivar:
    post:
      tags: [Unidades]
      summary: Baja lógica de una unidad *(admin)*
      parameters: [{ $ref: "#/components/parameters/IdPath" }]
      responses:
        "200":
          description: Unidad desactivada
          content:
            application/json: { schema: { $ref: "#/components/schemas/Unidad" } }
        "400": { $ref: "#/components/responses/ErrorValidacion" }
        "403": { $ref: "#/components/responses/SinPermiso" }

  /api/unidades/{id}/documentos:
    get:
      tags: [Documentos]
      summary: Documentos de una unidad (SOAT, revisión técnica, ...)
      parameters: [{ $ref: "#/components/parameters/IdPath" }]
      responses:
        "200":
          description: Lista de documentos
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/DocumentoUnidad" } }
        "401": { $ref: "#/components/responses/NoAutenticado" }
    post:
      tags: [Documentos]
      summary: Agregar un documento a una unidad *(admin)*
      parameters: [{ $ref: "#/components/parameters/IdPath" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/NuevoDocumentoUnidad" }
      responses:
        "201":
          description: Documento agregado
          content:
            application/json: { schema: { $ref: "#/components/schemas/DocumentoUnidad" } }
        "400": { $ref: "#/components/responses/ErrorValidacion" }
        "403": { $ref: "#/components/responses/SinPermiso" }

  /api/unidades/{id}/documentos/{docId}:
    delete:
      tags: [Documentos]
      summary: Eliminar un documento de una unidad *(admin)*
      parameters:
        - { $ref: "#/components/parameters/IdPath" }
        - { name: docId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: Eliminado
          content:
            application/json: { schema: { type: object, properties: { ok: { type: boolean } } } }
        "400": { $ref: "#/components/responses/ErrorValidacion" }
        "403": { $ref: "#/components/responses/SinPermiso" }

  /api/choferes:
    get:
      tags: [Choferes]
      summary: Listar los choferes de mi empresa
      parameters: [{ $ref: "#/components/parameters/EmpresaSuperadmin" }]
      responses:
        "200":
          description: Lista de choferes
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/Chofer" } }
        "401": { $ref: "#/components/responses/NoAutenticado" }
    post:
      tags: [Choferes]
      summary: Registrar un chofer *(admin)*
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/NuevoChofer" }
      responses:
        "201":
          description: Chofer registrado
          content:
            application/json: { schema: { $ref: "#/components/schemas/Chofer" } }
        "400": { $ref: "#/components/responses/ErrorValidacion" }
        "403": { $ref: "#/components/responses/SinPermiso" }

  /api/choferes/{id}/desactivar:
    post:
      tags: [Choferes]
      summary: Baja lógica de un chofer *(admin)*
      parameters: [{ $ref: "#/components/parameters/IdPath" }]
      responses:
        "200":
          description: Chofer desactivado
          content:
            application/json: { schema: { $ref: "#/components/schemas/Chofer" } }
        "403": { $ref: "#/components/responses/SinPermiso" }

  /api/choferes/{id}/documentos:
    get:
      tags: [Documentos]
      summary: Documentos de un chofer (licencia, certificado médico, ...)
      parameters: [{ $ref: "#/components/parameters/IdPath" }]
      responses:
        "200":
          description: Lista de documentos
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/DocumentoChofer" } }
        "401": { $ref: "#/components/responses/NoAutenticado" }
    post:
      tags: [Documentos]
      summary: Agregar un documento a un chofer *(admin)*
      parameters: [{ $ref: "#/components/parameters/IdPath" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/NuevoDocumentoChofer" }
      responses:
        "201":
          description: Documento agregado
          content:
            application/json: { schema: { $ref: "#/components/schemas/DocumentoChofer" } }
        "400": { $ref: "#/components/responses/ErrorValidacion" }
        "403": { $ref: "#/components/responses/SinPermiso" }

  /api/choferes/{id}/documentos/{docId}:
    delete:
      tags: [Documentos]
      summary: Eliminar un documento de un chofer *(admin)*
      parameters:
        - { $ref: "#/components/parameters/IdPath" }
        - { name: docId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: Eliminado
          content:
            application/json: { schema: { type: object, properties: { ok: { type: boolean } } } }
        "403": { $ref: "#/components/responses/SinPermiso" }

  /api/vencimientos:
    get:
      tags: [Vencimientos]
      summary: Documentos (de unidades y choferes) vencidos o por vencer
      parameters:
        - name: dias
          in: query
          required: false
          schema: { type: integer, default: 30, minimum: 1, maximum: 365 }
          description: Rango hacia adelante. Incluye también los ya vencidos.
        - { $ref: "#/components/parameters/EmpresaSuperadmin" }
      responses:
        "200":
          description: Lista ordenada por fecha de vencimiento
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/Vencimiento" } }
        "401": { $ref: "#/components/responses/NoAutenticado" }

  /api/catalogos:
    get:
      tags: [Tickets]
      summary: Listas para los desplegables del ticket y del registro de unidad
      description: >
        mercancias/centrosOrigen/destinos son cerrados (el ticket los
        valida). tiposVehiculo/tiposRodada/formasApertura son solo
        sugerencias para el formulario de unidad (no se validan).
      responses:
        "200":
          description: Las listas
          content:
            application/json:
              schema:
                type: object
                properties:
                  mercancias:
                    type: array
                    items: { $ref: "#/components/schemas/Mercancia" }
                  centrosOrigen:
                    type: array
                    items: { $ref: "#/components/schemas/CentroOrigen" }
                  destinos:
                    type: array
                    items: { $ref: "#/components/schemas/Destino" }
                  tiposVehiculo: { type: array, items: { type: string } }
                  tiposRodada: { type: array, items: { type: string } }
                  formasApertura: { type: array, items: { type: string } }

  /api/consulta/ruc/{ruc}:
    get:
      tags: [Unidades]
      summary: Autocompletar datos del dueño por RUC (SUNAT)
      description: >
        Todavía sin proveedor externo: responde `{ "configurado": false }`.
        Ver src/consulta/consultaIdentidad.js.
      parameters:
        - { name: ruc, in: path, required: true, schema: { type: string, pattern: "^[0-9]{11}$" } }
      responses:
        "200":
          description: Datos del RUC, o { configurado:false } si no hay proveedor
          content:
            application/json:
              schema:
                oneOf:
                  - type: object
                    properties: { configurado: { const: false } }
                  - type: object
                    properties:
                      configurado: { const: true }
                      ruc: { type: string }
                      nombre: { type: string }
                      direccion: { type: [string, "null"] }
        "401": { $ref: "#/components/responses/NoAutenticado" }

  /api/consulta/dni/{dni}:
    get:
      tags: [Unidades]
      summary: Autocompletar ubicación del transportista por DNI (RENIEC)
      description: >
        Todavía sin proveedor externo: responde `{ "configurado": false }`.
      parameters:
        - { name: dni, in: path, required: true, schema: { type: string, pattern: "^[0-9]{8}$" } }
      responses:
        "200":
          description: Datos del DNI, o { configurado:false } si no hay proveedor
          content:
            application/json:
              schema:
                oneOf:
                  - type: object
                    properties: { configurado: { const: false } }
                  - type: object
                    properties:
                      configurado: { const: true }
                      dni: { type: string }
                      nombres: { type: string }
                      apellidos: { type: string }
                      departamento: { type: [string, "null"] }
                      provincia: { type: [string, "null"] }
                      distrito: { type: [string, "null"] }
        "401": { $ref: "#/components/responses/NoAutenticado" }
        "401": { $ref: "#/components/responses/NoAutenticado" }

  /api/tickets:
    get:
      tags: [Tickets]
      summary: Listar los tickets de mi empresa (más recientes primero)
      parameters: [{ $ref: "#/components/parameters/EmpresaSuperadmin" }]
      responses:
        "200":
          description: Lista de tickets
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/Ticket" } }
        "401": { $ref: "#/components/responses/NoAutenticado" }
    post:
      tags: [Tickets]
      summary: Crear un ticket y disparar la emisión de la GRE
      description: >
        La unidad y el chofer deben estar registrados, ser de mi empresa
        y estar activos. `creadoPor` se toma del token. Responde antes de
        que SUNAT conteste (`estadoSunat: "ENVIANDO"`).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/NuevoTicket" }
      responses:
        "201":
          description: Ticket creado (emisión en curso)
          content:
            application/json: { schema: { $ref: "#/components/schemas/Ticket" } }
        "400": { $ref: "#/components/responses/ErrorValidacion" }
        "401": { $ref: "#/components/responses/NoAutenticado" }

  /api/tickets/{id}:
    get:
      tags: [Tickets]
      summary: Detalle de un ticket (con el estado actual de su GRE)
      parameters: [{ $ref: "#/components/parameters/IdPath" }]
      responses:
        "200":
          description: Ticket encontrado
          content:
            application/json: { schema: { $ref: "#/components/schemas/Ticket" } }
        "404":
          description: No encontrado (o de otra empresa)
          content:
            application/json: { schema: { $ref: "#/components/schemas/Error" } }

  /api/tickets/{id}/avanzar:
    post:
      tags: [Tickets]
      summary: Cambiar el estado operativo del ticket
      description: >
        Solo se puede pasar a `EN_TRANSITO` o `ENTREGADO` si la GRE fue
        `ACEPTADO`. `ANULADO` se permite salvo que ya esté anulado. Marca
        `fechaTraslado` / `fechaEntrega` y deja registro en el historial.
      parameters: [{ $ref: "#/components/parameters/IdPath" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [estadoOperativo]
              properties:
                estadoOperativo: { $ref: "#/components/schemas/EstadoOperativo" }
      responses:
        "200":
          description: Estado actualizado
          content:
            application/json: { schema: { $ref: "#/components/schemas/Ticket" } }
        "400": { $ref: "#/components/responses/ErrorValidacion" }
        "404":
          description: No encontrado (o de otra empresa)
          content:
            application/json: { schema: { $ref: "#/components/schemas/Error" } }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: Token devuelto por POST /api/auth/login

  parameters:
    IdPath:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }
    EmpresaSuperadmin:
      name: empresaId
      in: query
      required: false
      description: Obligatorio si el token es de un superadmin; ignorado para otros roles.
      schema: { type: string, format: uuid }

  responses:
    ErrorValidacion:
      description: Datos inválidos o regla de negocio no cumplida
      content:
        application/json: { schema: { $ref: "#/components/schemas/Error" } }
    NoAutenticado:
      description: Falta el token o expiró
      content:
        application/json: { schema: { $ref: "#/components/schemas/Error" } }
    SinPermiso:
      description: El rol del usuario no permite esta acción
      content:
        application/json: { schema: { $ref: "#/components/schemas/Error" } }

  schemas:
    Error:
      type: object
      properties:
        error: { type: string, example: "Faltan campos obligatorios: origen, destino" }

    RolUsuario: { type: string, enum: [admin_empresa, operador, superadmin] }
    CategoriaMtc: { type: string, enum: [N1, N2, N3] }
    ConfiguracionVehicular:
      type: string
      description: Código del Anexo IV del RNV (DS 058-2003-MTC).
      enum: [C2, C2R2, C2R3, C3, C3R2, C3R3, C4, T2S1, T2S2, T2S3, T3S1, T3S2, T3S3]
    MotivoTraslado: { type: string, enum: [VENTA, TRASLADO_ENTRE_ESTABLECIMIENTOS, OTROS] }
    # Catálogos fijos de TransGuía (no los exige SUNAT; estandarizan el
    # dashboard). Se aceptan sin distinguir mayúsculas/tildes/espacios de
    # más y se guardan en su forma canónica. Fuente: GET /api/catalogos.
    Mercancia:
      type: string
      enum:
        - Carbón Trujillo
        - Caliza Roca Fuerte
        - Silice de Terceros
        - Puzolana Terceros
        - Puzolana Ayacucho
    CentroOrigen:
      type: string
      description: Patio/centro desde donde sale la carga (campo "origen" del ticket).
      enum: [Quri, Transmilsa, Atipax, Juscamaita]
    Destino:
      type: string
      description: Planta o punto de entrega (campo "destino" del ticket).
      enum: [Atocongo, Condorcocha, Muelle Conchán]
    EstadoOperativo: { type: string, enum: [GENERADO, EN_TRANSITO, ENTREGADO, ANULADO] }
    EstadoSunat: { type: string, enum: [ENVIANDO, ACEPTADO, RECHAZADO, OBSERVADO] }
    TipoDocumentoUnidad: { type: string, enum: [SOAT, REVISION_TECNICA, TARJETA_CIRCULACION, PERMISO_OPERACION, OTRO] }
    TipoDocumentoChofer: { type: string, enum: [LICENCIA_CONDUCIR, CERTIFICADO_MEDICO, OTRO] }
    CategoriaLicencia: { type: string, enum: ["A-I", "A-IIa", "A-IIb", "A-IIIa", "A-IIIb", "A-IIIc"] }

    UsuarioPublico:
      type: object
      properties:
        id: { type: string, format: uuid }
        username: { type: string }
        nombreCompleto: { type: string }
        rol: { $ref: "#/components/schemas/RolUsuario" }

    Sesion:
      type: object
      properties:
        id: { type: string, format: uuid }
        empresaId: { type: [string, "null"], format: uuid, description: "null para un superadmin" }
        username: { type: string }
        nombreCompleto: { type: string }
        rol: { $ref: "#/components/schemas/RolUsuario" }
        token: { type: string, description: "Enviar como 'Authorization: Bearer <token>'" }
        expiraEnMs: { type: integer, example: 43200000 }

    ResumenGlobal:
      type: object
      properties:
        empresas: { type: integer }
        unidadesActivas: { type: integer }
        choferesActivos: { type: integer }
        tickets: { type: integer }
        ticketsGenerados: { type: integer }
        ticketsEnTransito: { type: integer }
        ticketsEntregados: { type: integer }
        documentosVencidos: { type: integer }

    EmpresaResumen:
      type: object
      properties:
        id: { type: string, format: uuid }
        ruc: { type: string }
        razonSocial: { type: string }
        creadoEn: { type: string, format: date-time }
        unidadesActivas: { type: integer }
        choferesActivos: { type: integer }
        tickets: { type: integer }
        ticketsEnTransito: { type: integer }
        documentosVencidos: { type: integer }

    NuevaEmpresa:
      type: object
      required: [ruc, razonSocial, admin]
      properties:
        ruc: { type: string, pattern: "^[0-9]{11}$", example: "20512345678" }
        razonSocial: { type: string, example: "Transportes El Sol S.A.C." }
        admin:
          type: object
          required: [username, password, nombreCompleto]
          properties:
            username: { type: string }
            password: { type: string, format: password, minLength: 8 }
            nombreCompleto: { type: string }

    EmpresaCreada:
      type: object
      properties:
        empresa:
          type: object
          properties:
            id: { type: string, format: uuid }
            ruc: { type: string }
            razonSocial: { type: string }
            creadoEn: { type: string, format: date-time }
        admin: { $ref: "#/components/schemas/UsuarioPublico" }

    Dashboard:
      type: object
      properties:
        alcance: { type: string, example: "Todas las empresas" }
        agrupacion: { type: string, enum: [dia, mes] }
        trasladosPorPeriodo:
          type: array
          items:
            type: object
            properties:
              periodo: { type: string, example: "2026-09-08" }
              cantidad: { type: integer }
        porEstadoOperativo:
          type: object
          properties:
            GENERADO: { type: integer }
            EN_TRANSITO: { type: integer }
            ENTREGADO: { type: integer }
            ANULADO: { type: integer }
        toneladasPorMaterial:
          type: array
          items:
            type: object
            properties:
              material: { $ref: "#/components/schemas/Mercancia" }
              toneladas: { type: number, example: 24.6 }
              traslados: { type: integer }
        tiempoFinalizacion:
          type: object
          properties:
            promedioHoras: { type: [number, "null"] }
            minHoras: { type: [number, "null"] }
            maxHoras: { type: [number, "null"] }
            muestras: { type: integer }
            recientes:
              type: array
              items:
                type: object
                properties:
                  codigo: { type: string, example: "TCK-000010" }
                  horas: { type: number, example: 14.2 }

    NuevaUnidad:
      type: object
      description: >
        Solo placa, rucPropietario y dniTransportista son obligatorios;
        el resto se puede completar después. Los campos "autocompletados"
        (nombrePropietario, direccionPropietario, departamento, provincia,
        distrito) hoy se cargan a mano. nroSoat/vigenciaSoat y
        nroCitv/vigenciaCitv NO se guardan en la unidad: se registran como
        documentos con vencimiento (tipo SOAT y REVISION_TECNICA).
      required: [placa, rucPropietario, dniTransportista]
      properties:
        placa: { type: string, description: "3 letras + 3 dígitos; se normaliza a ABC-123", example: ABC-756 }
        rucPropietario: { type: string, pattern: "^[0-9]{11}$", description: "RUC del dueño del vehículo" }
        nombrePropietario: { type: string }
        direccionPropietario: { type: string }
        dniTransportista: { type: string, pattern: "^[0-9]{8}$", description: "DNI del transportista responsable" }
        departamento: { type: string }
        provincia: { type: string }
        distrito: { type: string }
        tipoVehiculo: { type: string, description: "Ver GET /api/catalogos → tiposVehiculo" }
        marca: { type: string, example: Volvo }
        modelo: { type: string, example: "FH 460" }
        anioFabricacion: { type: [integer, "null"], minimum: 1970, example: 2021 }
        categoriaMtc: { $ref: "#/components/schemas/CategoriaMtc" }
        configuracionVehicular: { $ref: "#/components/schemas/ConfiguracionVehicular" }
        nroEjes: { type: integer, minimum: 2, maximum: 12, example: 3 }
        rodadaEjeDelantero: { type: string, description: "Ver GET /api/catalogos → tiposRodada" }
        rodadaC1: { type: string }
        rodadaC2: { type: string }
        pesoSecoKg: { type: number, example: 14500 }
        tolvaCerrada: { type: boolean, description: "Acepta true/false o \"SI\"/\"NO\"" }
        carretaConPiston: { type: boolean }
        unidadAGas: { type: boolean }
        formaApertura: { type: string, description: "Ver GET /api/catalogos → formasApertura" }
        alturaM: { type: number, example: 3.20 }
        anchoM: { type: number, example: 2.60 }
        largoM: { type: number, example: 12.30 }
        alturaPlataformaM: { type: number, example: 1.20 }
        nroSoat: { type: string }
        vigenciaSoat: { type: string, format: date }
        nroCitv: { type: string }
        vigenciaCitv: { type: string, format: date }

    Unidad:
      description: >
        Como NuevaUnidad (sin nroSoat/vigenciaSoat/nroCitv/vigenciaCitv,
        que viven en documentos_unidad) más id, empresaId, activo, creadoEn.
        En un alta con SOAT/CITV mal cargados, la respuesta incluye `avisos`.
      allOf:
        - $ref: "#/components/schemas/NuevaUnidad"
        - type: object
          properties:
            id: { type: string, format: uuid }
            empresaId: { type: string, format: uuid }
            activo: { type: boolean }
            creadoEn: { type: string, format: date-time }
            avisos: { type: array, items: { type: string } }

    NuevoChofer:
      type: object
      required: [dni, nombres, apellidos]
      properties:
        dni: { type: string, pattern: "^[0-9]{8}$", example: "45678912" }
        nombres: { type: string, example: "Luis Alberto" }
        apellidos: { type: string, example: "Quispe Mamani" }

    Chofer:
      allOf:
        - $ref: "#/components/schemas/NuevoChofer"
        - type: object
          properties:
            id: { type: string, format: uuid }
            empresaId: { type: string, format: uuid }
            activo: { type: boolean }
            creadoEn: { type: string, format: date-time }

    NuevoDocumentoUnidad:
      type: object
      required: [tipoDocumento, fechaVencimiento]
      properties:
        tipoDocumento: { $ref: "#/components/schemas/TipoDocumentoUnidad" }
        numeroDocumento: { type: [string, "null"] }
        fechaEmision: { type: [string, "null"], format: date, example: "2025-01-15" }
        fechaVencimiento: { type: string, format: date, example: "2026-12-31" }
        archivoUrl: { type: [string, "null"] }

    DocumentoUnidad:
      allOf:
        - $ref: "#/components/schemas/NuevoDocumentoUnidad"
        - type: object
          properties:
            id: { type: string, format: uuid }
            unidadId: { type: string, format: uuid }
            creadoEn: { type: string, format: date-time }

    NuevoDocumentoChofer:
      type: object
      required: [tipoDocumento, fechaVencimiento]
      properties:
        tipoDocumento: { $ref: "#/components/schemas/TipoDocumentoChofer" }
        numeroDocumento: { type: [string, "null"] }
        categoriaLicencia:
          description: Solo para LICENCIA_CONDUCIR.
          oneOf:
            - $ref: "#/components/schemas/CategoriaLicencia"
            - type: "null"
        fechaEmision: { type: [string, "null"], format: date }
        fechaVencimiento: { type: string, format: date }

    DocumentoChofer:
      allOf:
        - $ref: "#/components/schemas/NuevoDocumentoChofer"
        - type: object
          properties:
            id: { type: string, format: uuid }
            choferId: { type: string, format: uuid }
            creadoEn: { type: string, format: date-time }

    Vencimiento:
      type: object
      properties:
        tipo: { type: string, enum: [unidad, chofer] }
        referencia: { type: string, description: "Placa de la unidad o nombre del chofer", example: ABC-756 }
        documento: { type: string, example: SOAT }
        fechaVencimiento: { type: string, format: date }
        diasRestantes: { type: integer, description: "Negativo si ya venció", example: -5 }

    NuevoTicket:
      type: object
      required: [unidadId, choferId, origen, destino, descripcionMercancia, pesoBrutoKg]
      properties:
        unidadId: { type: string, format: uuid }
        choferId: { type: string, format: uuid }
        origen: { $ref: "#/components/schemas/CentroOrigen" }
        destino: { $ref: "#/components/schemas/Destino" }
        motivo:
          description: "Texto libre también aceptado; se traduce al enum (vacío → VENTA)."
          oneOf:
            - $ref: "#/components/schemas/MotivoTraslado"
            - type: string
        descripcionMercancia: { $ref: "#/components/schemas/Mercancia" }
        pesoBrutoKg: { type: number, exclusiveMinimum: 0, example: 8200 }

    Ticket:
      type: object
      properties:
        id: { type: string, format: uuid }
        codigoInterno: { type: string, example: TCK-000001 }
        empresaId: { type: string, format: uuid }
        unidadId: { type: string, format: uuid }
        choferId: { type: string, format: uuid }
        placa: { type: string, example: ABC-756 }
        configuracionVehicular: { $ref: "#/components/schemas/ConfiguracionVehicular" }
        choferDni: { type: string, example: "45678912" }
        choferNombres: { type: string, example: "Luis Alberto Quispe Mamani" }
        origen: { $ref: "#/components/schemas/CentroOrigen" }
        destino: { $ref: "#/components/schemas/Destino" }
        motivo: { $ref: "#/components/schemas/MotivoTraslado" }
        descripcionMercancia: { $ref: "#/components/schemas/Mercancia" }
        pesoBrutoKg: { type: number }
        estadoOperativo: { $ref: "#/components/schemas/EstadoOperativo" }
        estadoSunat: { $ref: "#/components/schemas/EstadoSunat" }
        serieCorrelativoGre: { type: [string, "null"], example: T001-000160 }
        motivoRechazo: { type: [string, "null"] }
        creadoPor: { type: [string, "null"], format: uuid, description: "Usuario que creó el ticket (del token)" }
        fechaTraslado: { type: [string, "null"], format: date-time }
        fechaEntrega: { type: [string, "null"], format: date-time }
        creadoEn: { type: string, format: date-time }
